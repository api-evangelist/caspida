name: Caspida
description: Caspida was a cybersecurity company specializing in user and entity behavior
  analytics (UEBA), applying unsupervised machine learning to network, endpoint, and
  identity data to detect insider threats and advanced attacks without predefined rules.
  Splunk acquired Caspida in July 2015 and folded its technology into Splunk User Behavior
  Analytics (Splunk UBA). Caspida no longer operates as an independent company and
  publishes no standalone developer program, API, or documentation surface; this profile
  is retained in the API Evangelist network as a historical company record.
